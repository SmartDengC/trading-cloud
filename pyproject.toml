[project]
name = "trading-cloud"
version = "0.1.0"
description = "FastAPI backend for the market diary trading terminal"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi[standard]>=0.116,<1",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "openpyxl>=3.1,<4",
  "pillow>=11.3,<13",
  "psycopg[binary,pool]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<2.2",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
